name: Terraform CI/CD

# Pipeline de Terraform para el Data Lake (DMS -> S3 -> Glue)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # permite ejecutar apply manualmente desde la UI

permissions:
  contents: read
  pull-requests: write # para comentar el plan en el PR

env:
  TF_VERSION: "1.11.0"
  AWS_REGION: "us-east-1"

jobs:
  # -------------------------------------------------------------------
  # VALIDACIÓN + PLAN (corre en PR y en push)
  # -------------------------------------------------------------------
  plan:
    name: Validate & Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive
        continue-on-error: true

      # El backend usa profile="datalake"; en CI usamos credenciales del runner.
      # -backend-config sobreescribe el profile para que use las env vars de AWS.
      - name: Terraform Init
        run: terraform init -backend-config="profile="

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -out=tfplan.binary

  # -------------------------------------------------------------------
  # APPLY (solo en push a main o ejecución manual; requiere aprobación)
  # -------------------------------------------------------------------
  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production # exige aprobación manual si configuras el environment en GitHub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config="profile="

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
